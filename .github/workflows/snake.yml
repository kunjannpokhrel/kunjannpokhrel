name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Generate custom snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: kunjannpokhrel
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00D9FF&color_dots=#07111F,#0B2A45,#075985,#0099CC,#00D9FF
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00FFFF&color_dots=#050B14,#071F33,#063B5C,#0077A3,#00D9FF

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}